services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: company-it-postgres
    environment:
      POSTGRES_DB: company_it_service
      POSTGRES_USER: it_admin
      POSTGRES_PASSWORD: it_admin_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U it_admin -d company_it_service"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

