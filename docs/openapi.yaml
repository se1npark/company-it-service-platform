openapi: 3.1.0
info:
  title: Company IT Service Platform API
  version: 0.1.0
  description: REST API for tickets, users, assets, and support copilot analysis.
servers:
  - url: http://localhost:4000
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        "200":
          description: API health response
  /api/tickets:
    get:
      summary: List tickets
      responses:
        "200":
          description: Ticket collection
    post:
      summary: Create a ticket
      responses:
        "201":
          description: Created ticket
  /api/tickets/{id}:
    get:
      summary: Get ticket by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ticket details
        "404":
          description: Ticket not found
  /api/tickets/{id}/status:
    patch:
      summary: Update ticket status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated ticket
  /api/assets:
    get:
      summary: List assets
      responses:
        "200":
          description: Asset collection
  /api/users:
    get:
      summary: List users
      responses:
        "200":
          description: User collection
  /api/copilot/analyse:
    post:
      summary: Analyse an IT support issue with the copilot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - issue
              properties:
                issue:
                  type: string
                  minLength: 8
                  example: I cannot sign in to Outlook after password reset and MFA keeps looping.
      responses:
        "200":
          description: Copilot analysis with category, priority, confidence, steps, and citations

